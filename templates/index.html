<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envases VillaPET - Producción Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .form-control, .form-select { background-color: #0d1117; border: 1px solid #30363d; color: #fff; }
        .form-control:focus, .form-select:focus { background-color: #0d1117; color: #fff; border-color: #58a6ff; box-shadow: none; }
        .btn-primary { background-color: #238636; border: none; }
        .btn-primary:hover { background-color: #2ea043; }
        .sidebar { background-color: #161b22; min-height: 100vh; border-right: 1px solid #30363d; }
        .nav-link { color: #8b949e; border-radius: 8px; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background-color: #21262d; color: #58a6ff; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 p-3 sidebar">
                <h4 class="text-white fw-bold mb-4"><i class="fas fa-industry text-primary"></i> VillaPET Pro</h4>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-plus-circle me-2"></i> Nuevo Ingreso</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-search me-2"></i> Registro & Buscador</a></li>
                    <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-boxes me-2"></i> Artículos</a></li>
                </ul>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Registro de Producción</h2>
                    <span class="badge bg-success">Supabase Conectado</span>
                </div>

                <div class="card p-4 shadow-sm">
                    <form id="formIngreso">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Fecha Producción</label>
                                <input type="date" class="form-control" id="fecha_prod" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Fecha Entrega</label>
                                <input type="date" class="form-control" id="fecha_ent" required>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Hora</label>
                                <input type="time" class="form-control" id="hora" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nota / Lote</label>
                                <input type="text" class="form-control" id="nota" placeholder="Ej: Lote A-1">
                            </div>

                            <!-- BUSCARV por NRO -->
                            <div class="col-md-2">
                                <label class="form-label fw-bold text-info">Nº Renglón (NRO)</label>
                                <input type="number" class="form-control border-info" id="nro" placeholder="Ingrese NRO" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Código</label>
                                <input type="text" class="form-control" id="codigo" readonly>
                            </div>
                            <div class="col-md-7">
                                <label class="form-label">Descripción</label>
                                <input type="text" class="form-control" id="descripcion" readonly>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label">Almacén</label>
                                <input type="text" class="form-control" id="almacen" readonly>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Unidad</label>
                                <input type="text" class="form-control" id="unidad" readonly>
                            </div>

                            <!-- Cantidad con Evaluación de Fórmulas -->
                            <div class="col-md-3">
                                <label class="form-label fw-bold text-warning">Cantidad (Fórmula)</label>
                                <input type="text" class="form-control border-warning" id="cantidad" placeholder="Ej: =10+5 o 120" required>
                            </div>

                            <!-- Peso con Evaluación de Fórmulas -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-warning">Peso (Fórmula)</label>
                                <input type="text" class="form-control border-warning" id="peso" placeholder="Ej: =0.68*12+2" required>
                            </div>

                            <!-- Desplegable de Movimientos -->
                            <div class="col-md-4">
                                <label class="form-label">Tipo de Movimiento</label>
                                <select class="form-select" id="movimiento">
                                    <option value="ENT0005">ENT0005</option>
                                    <option value="ENT0008">ENT0008</option>
                                    <option value="ENT0009" selected>ENT0009 (Por defecto)</option>
                                    <option value="ENT0012">ENT0012</option>
                                </select>
                            </div>

                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold"><i class="fas fa-save me-2"></i> Guardar Registro</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Evaluador matemático tipo Excel para fórmulas en campos de texto
        function evaluarFormula(valor) {
            if (!valor) return 0;
            let expr = valor.toString().trim();
            if (expr.startsWith('=') || expr.startsWith('+')) {
                expr = expr.replace(/^[=+]/, '');
            }
            try {
                if (/^[0-9+*/.()-]+$/.test(expr)) {
                    let res = Function('"use strict"; return (' + expr + ')')();
                    return Math.round(res * 100) / 100;
                }
            } catch (e) {
                console.error("Error evaluando fórmula", e);
            }
            let num = parseFloat(valor);
            return isNaN(num) ? 0 : Math.round(num * 100) / 100;
        }

        // Búsqueda automática tipo BUSCARV al cambiar el NRO
        document.getElementById('nro').addEventListener('blur', async function() {
            let nro = this.value;
            if (!nro) return;
            try {
                let response = await fetch(`/api/buscar_articulo/${nro}`);
                let data = await response.json();
                if (data.exito) {
                    document.getElementById('codigo').value = data.codigo;
                    document.getElementById('descripcion').value = data.descripcion;
                    document.getElementById('almacen').value = data.almacen;
                    document.getElementById('unidad').value = data.unidad;
                    document.getElementById('cantidad').value = data.armado; // Valor por defecto del maestro
                    document.getElementById('movimiento').value = data.movimiento;
                } else {
                    alert("Artículo no encontrado para el NRO ingresado.");
                }
            } catch (err) {
                console.error("Error en búsqueda:", err);
            }
        });

        // Envío de datos al backend
        document.getElementById('formIngreso').addEventListener('submit', async function(e) {
            e.preventDefault();

            let payload = {
                fecha_prod: document.getElementById('fecha_prod').value,
                fecha_ent: document.getElementById('fecha_ent').value,
                hora: document.getElementById('hora').value,
                nota: document.getElementById('nota').value,
                nro: document.getElementById('nro').value,
                codigo: document.getElementById('codigo').value,
                descripcion: document.getElementById('descripcion').value,
                almacen: document.getElementById('almacen').value,
                unidad: document.getElementById('unidad').value,
                cantidad: evaluarFormula(document.getElementById('cantidad').value),
                peso: evaluarFormula(document.getElementById('peso').value),
                movimiento: document.getElementById('movimiento').value,
                secuencia: 1
            };

            try {
                let res = await fetch('/api/guardar_ingreso', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                if (result.exito) {
                    alert("¡Registro guardado con éxito en Supabase!");
                    this.reset();
                } else {
                    alert("Error al guardar: " + result.error);
                }
            } catch (err) {
                alert("Error de red al guardar el registro.");
            }
        });
    </script>
</body>
</html>
